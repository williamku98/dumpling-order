<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水餃訂購系統 - 管理後台</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            margin: 0;
            background-color: #f4f7f6;
            display: flex;
            height: 100vh;
        }
        /* 載入中遮罩 */
        #loadingOverlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
        }
        /* 登入遮罩畫面 */
        #loginOverlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 8888;
        }
        .login-card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            width: 320px;
            text-align: center;
        }
        .login-card h2 {
            margin-bottom: 20px;
            color: #2c3e50;
        }
        .login-card input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .login-card button {
            width: 100%;
            padding: 10px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .login-card button:hover {
            background-color: #2980b9;
        }

        /* 側邊導覽列 */
        .sidebar {
            width: 250px;
            background-color: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            padding-top: 20px;
            flex-shrink: 0;
        }
        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 18px;
        }
        .nav-links {
            display: flex;
            flex-direction: column;
            width: 100%;
        }
        .sidebar a {
            color: white;
            text-decoration: none;
            padding: 15px 20px;
            display: block;
            border-left: 4px solid transparent;
            transition: all 0.3s;
            cursor: pointer;
        }
        .sidebar a:hover, .sidebar a.active {
            background-color: #34495e;
            border-left: 4px solid #3498db;
        }
        .sidebar .logout-btn {
            margin-top: auto;
            background-color: #c0392b;
            border-left: none;
            text-align: center;
        }
        .sidebar .logout-btn:hover {
            background-color: #e74c3c;
        }

        /* 主內容區 */
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            margin-bottom: 15px;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            font-size: 14px;
            vertical-align: middle;
        }
        th {
            background-color: #f8f9fa;
        }
        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        .btn-primary { background-color: #3498db; color: white; }
        .btn-primary:hover { background-color: #2980b9; }
        .btn-success { background-color: #2ecc71; color: white; }
        .btn-success:hover { background-color: #27ae60; }
        .btn-danger { background-color: #e74c3c; color: white; }
        .btn-danger:hover { background-color: #c0392b; }

        input[type="text"], input[type="number"] {
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        /* RWD 手機版調整 */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
            }
            .sidebar {
                width: 100%;
                height: auto;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                padding: 10px 15px;
                box-sizing: border-box;
            }
            .sidebar h2 { margin: 0; font-size: 15px; }
            .nav-links { flex-direction: row; width: auto; }
            .sidebar a { padding: 8px 10px; font-size: 13px; border-left: none; }
            .sidebar a.active { border-bottom: 3px solid #3498db; background: transparent; }
            .sidebar .logout-btn { margin-top: 0; background: #c0392b; padding: 6px 10px; }
            .main-content { padding: 15px; }
            .card { padding: 15px; overflow-x: auto; }
        }
    </style>
</head>
<body>

    <!-- 登入驗證遮罩 -->
    <div id="loginOverlay">
        <div class="login-card">
            <h2>🔐 管理者登入</h2>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <input type="password" id="adminPasswordInput" required placeholder="請輸入管理密碼">
                <button type="submit">登入後台</button>
            </form>
            <div id="loginError" style="color: #e74c3c; margin-top: 10px; font-size: 14px;"></div>
        </div>
    </div>

    <!-- 載入中遮罩 -->
    <div id="loadingOverlay">
        <div style="font-size: 35px; margin-bottom: 15px;">🥟</div>
        <div id="loadingText">處理中，請稍候...</div>
    </div>

    <!-- 側邊選單 (預設隱藏，登入後顯示) -->
    <div class="sidebar" id="sidebarNav" style="display: none;">
        <h2>水餃管理後台</h2>
        <div class="nav-links">
            <a id="navOrders" class="active" onclick="switchAdminTab('orders')">📦 訂單管理</a>
            <a id="navMenu" onclick="switchAdminTab('menu')">🥟 品項維護</a>
        </div>
        <a class="logout-btn" onclick="handleLogout()">登出</a>
    </div>

    <!-- 主內容區 -->
    <div class="main-content" id="mainContentArea" style="display: none;">
        
        <!-- 區塊 1: 訂單管理 -->
        <div class="card" id="ordersTab">
            <h2>📦 客戶訂單管理</h2>
            <p style="color: #7f8c8d; font-size: 14px;">💡 可在此檢視所有訂單、針對公司團購或宅配手動修改運費/總金額，以及批次更新出貨狀態。</p>
            <div style="margin-bottom: 15px;">
                <button class="btn btn-success" onclick="batchShipOrders()">☑️ 將勾選的訂單設為「已出貨」</button>
                <button class="btn btn-primary" onclick="loadOrdersData()" style="margin-left: 10px;">🔄 重新整理訂單</button>
            </div>
            <div style="overflow-x: auto;">
                <table id="ordersTable">
                    <thead>
                        <tr>
                            <th><input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)"></th>
                            <th>訂單編號/時間</th>
                            <th>訂購人/電話/地址</th>
                            <th>訂購內容明細</th>
                            <th>總金額 (TWD)</th>
                            <th>狀態</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody">
                        <!-- 動態載入 -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 區塊 2: 品項維護 -->
        <div class="card" id="menuTab" style="display: none;">
            <h2>🥟 菜單品項維護</h2>
            <p style="color: #7f8c8d; font-size: 14px;">💡 在此新增、修改水餃口味與單價，點擊「儲存變更」後前台會即時同步更新。</p>
            <div style="margin-bottom: 15px;">
                <button class="btn btn-primary" onclick="addMenuRow()">➕ 新增品項</button>
                <button class="btn btn-success" onclick="saveMenuData()" style="margin-left: 10px;">💾 儲存並發布菜單</button>
            </div>
            <table id="menuTable">
                <thead>
                    <tr>
                        <th>品項名稱</th>
                        <th>單價 (NT$)</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="menuTableBody">
                    <!-- 動態載入 -->
                </tbody>
            </table>
        </div>

    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxmGo-q5ar3XtL3jujB9Qb1SAI7KipRctu_xBloQt0jy2lt-Kus4VvceKtLwleYS4am/exec";
        let cachedOrders = [];

        function toggleLoading(show, text="處理中...") {
            const overlay = document.getElementById('loadingOverlay');
            const textEl = document.getElementById('loadingText');
            if (overlay && textEl) {
                textEl.innerText = text;
                overlay.style.display = show ? 'flex' : 'none';
            }
        }

        // 登入驗證 (呼叫後端安全比對)
        async function handleLogin(e) {
            e.preventDefault();
            const pwd = document.getElementById('adminPasswordInput').value.trim();
            const errDiv = document.getElementById('loginError');
            errDiv.innerText = "";
            toggleLoading(true, "正在驗證密碼...");

            try {
                let res = await fetch(`${API_URL}?action=verifyAdmin&password=${encodeURIComponent(pwd)}`);
                let json = await res.json();
                
                if (json && json.success) {
                    // 驗證成功，隱藏登入框，顯示後台
                    document.getElementById('loginOverlay').style.display = 'none';
                    document.getElementById('sidebarNav').style.display = 'flex';
                    document.getElementById('mainContentArea').style.display = 'block';
                    
                    // 載入後台資料
                    loadOrdersData();
                    loadMenuData();
                } else {
                    errDiv.innerText = "❌ 密碼錯誤，請重新輸入！";
                }
            } catch (err) {
                errDiv.innerText = "❌ 連線錯誤，請檢查網路！";
            }
            toggleLoading(false);
        }

        function handleLogout() {
            document.getElementById('adminPasswordInput').value = "";
            document.getElementById('loginOverlay').style.display = 'flex';
            document.getElementById('sidebarNav').style.display = 'none';
            document.getElementById('mainContentArea').style.display = 'none';
        }

        // 切換後台分頁
        function switchAdminTab(tab) {
            const ordersTab = document.getElementById('ordersTab');
            const menuTab = document.getElementById('menuTab');
            const navOrders = document.getElementById('navOrders');
            const navMenu = document.getElementById('navMenu');

            if (tab === 'orders') {
                ordersTab.style.display = 'block';
                menuTab.style.display = 'none';
                navOrders.classList.add('active');
                navMenu.classList.remove('active');
                loadOrdersData();
            } else if (tab === 'menu') {
                ordersTab.style.display = 'none';
                menuTab.style.display = 'block';
                navOrders.classList.remove('active');
                navMenu.classList.add('active');
                loadMenuData();
            }
        }

        // ================= 訂單管理邏輯 =================
        async function loadOrdersData() {
            toggleLoading(true, "正在載入訂單...");
            try {
                let res = await fetch(API_URL + "?action=getOrders");
                let json = await res.json();
                if (json && json.success) {
                    cachedOrders = json.data;
                    renderOrdersTable(cachedOrders);
                } else {
                    alert("載入訂單失敗！");
                }
            } catch (err) {
                alert("連線錯誤！");
            }
            toggleLoading(false);
        }

        function renderOrdersTable(orders) {
            const tbody = document.getElementById('ordersTableBody');
            tbody.innerHTML = '';
            
            if (orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:#7f8c8d;">目前尚無任何訂單</td></tr>`;
                return;
            }

            // 新到舊排序
            let sorted = [...orders].reverse();

            sorted.forEach((o, index) => {
                let statusColor = o.status === '已出貨' ? '#2ecc71' : '#e67e22';
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><input type="checkbox" class="order-checkbox" value="${o.orderNumber}"></td>
                    <td><b>${o.orderNumber}</b><br><span style="font-size:12px; color:#7f8c8d;">${o.orderDate}</span></td>
                    <td><b>${o.name}</b> (${o.phone})<br><span style="font-size:13px;">${o.address}</span>${o.groupCode ? '<br><span style="color:#2980b9;">團代: ' + o.groupCode + '</span>' : ''}</td>
                    <td><div style="max-height:100px; overflow-y:auto; font-size:13px; line-height:1.4;">${o.itemsText.replace(/\n/g, '<br>')}</div></td>
                    <td><b>$ <input type="number" id="total_${o.orderNumber}" value="${o.total}" style="width: 80px; font-weight:bold; color:#c0392b;"></b></td>
                    <td><span style="color:${statusColor}; font-weight:bold;">${o.status}</span></td>
                    <td>
                        <button class="btn btn-primary" style="padding: 5px 10px; font-size:12px;" onclick="updateOrderFee('${o.orderNumber}')">更新金額</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function toggleSelectAll(master) {
            document.querySelectorAll('.order-checkbox').forEach(cb => cb.checked = master.checked);
        }

        // 管理者修改單筆訂單運費與總金額
        async function updateOrderFee(orderNum) {
            let newTotalInput = document.getElementById(`total_${orderNum}`);
            let newTotal = parseFloat(newTotalInput.value);
            if (isNaN(newTotal) || newTotal < 0) {
                alert("請輸入有效的金額數字！");
                return;
            }

            // 尋找原本的訂單物件，修改其金額與明細中的運費說明
            let target = cachedOrders.find(o => String(o.orderNumber) === String(orderNum));
            if (!target) return;

            // 自動更新明細字串中的總金額或運費標示
            let lines = target.itemsText.split('\n');
            let updatedLines = lines.map(line => {
                if (line.includes('運費：')) {
                    // 若原本是待後台確認，更新為實際補上的差額或直接標註
                    return `運費：已由後台調整`;
                }
                return line;
            });
            let newItemsText = updatedLines.join('\n');

            toggleLoading(true, "正在更新金額...");
            try {
                let params = new URLSearchParams({
                    action: "updateOrderShipping",
                    orderNumber: orderNum,
                    newTotal: newTotal,
                    newItemsText: newItemsText
                });

                let res = await fetch(API_URL + "?" + params.toString());
                let json = await res.json();
                if (json && json.success) {
                    alert(`訂單 ${orderNum} 金額已成功更新為 $${newTotal}！`);
                    loadOrdersData();
                } else {
                    alert("更新失敗！");
                }
            } catch (err) {
                alert("連線錯誤！");
            }
            toggleLoading(false);
        }

        // 批次設為已出貨
        async function batchShipOrders() {
            let checkedBoxes = document.querySelectorAll('.order-checkbox:checked');
            if (checkedBoxes.length === 0) {
                alert("請至少勾選一筆要出貨的訂單！");
                return;
            }

            let orderNums = Array.from(checkedBoxes).map(cb => cb.value);
            if (!confirm(`確定要將選取的 ${orderNums.length} 筆訂單狀態改為「已出貨」嗎？`)) return;

            toggleLoading(true, "正在更新出貨狀態...");
            try {
                let params = new URLSearchParams({
                    action: "updateOrderStatus",
                    orderNumbers: JSON.stringify(orderNums)
                });
                let res = await fetch(API_URL + "?" + params.toString());
                let json = await res.json();
                if (json && json.success) {
                    alert("狀態更新成功！");
                    loadOrdersData();
                } else {
                    alert("更新失敗！");
                }
            } catch (err) {
                alert("連線錯誤！");
            }
            toggleLoading(false);
        }

        // ================= 品項維護邏輯 =================
        async function loadMenuData() {
            toggleLoading(true, "正在載入菜單...");
            try {
                let res = await fetch(API_URL + "?action=getMenu");
                let json = await res.json();
                if (json && json.success) {
                    renderMenuTable(json.data);
                } else {
                    alert("載入菜單失敗！");
                }
            } catch (err) {
                alert("連線錯誤！");
            }
            toggleLoading(false);
        }

        function renderMenuTable(menu) {
            const tbody = document.getElementById('menuTableBody');
            tbody.innerHTML = '';
            
            menu.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><input type="text" class="menu-name" value="${item.name}" style="width: 90%;"></td>
                    <td><input type="number" class="menu-price" value="${item.price}" style="width: 100px;"></td>
                    <td><button class="btn btn-danger" style="padding: 5px 10px; font-size:12px;" onclick="this.closest('tr').remove()">刪除</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function addMenuRow() {
            const tbody = document.getElementById('menuTableBody');
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><input type="text" class="menu-name" placeholder="請輸入新品項名稱" style="width: 90%;"></td>
                <td><input type="number" class="menu-price" value="100" style="width: 100px;"></td>
                <td><button class="btn btn-danger" style="padding: 5px 10px; font-size:12px;" onclick="this.closest('tr').remove()">刪除</button></td>
            `;
            tbody.appendChild(tr);
        }

        async function saveMenuData() {
            let names = document.querySelectorAll('.menu-name');
            let prices = document.querySelectorAll('.menu-price');
            let newMenu = [];

            for (let i = 0; i < names.length; i++) {
                let name = names[i].value.trim();
                let price = parseInt(prices[i].value);
                if (name && !isNaN(price)) {
                    newMenu.push({ name: name, price: price });
                }
            }

            if (newMenu.length === 0) {
                alert("菜單至少需要有一個有效品項！");
                return;
            }

            if (!confirm("確定要儲存並發布這份最新菜單嗎？前台將會立即同步更新。")) return;

            toggleLoading(true, "正在儲存菜單...");
            try {
                let params = new URLSearchParams({
                    action: "saveMenu",
                    menuData: JSON.stringify(newMenu)
                });
                let res = await fetch(API_URL + "?" + params.toString());
                let json = await res.json();
                if (json && json.success) {
                    alert("菜單儲存並發布成功！");
                    loadMenuData();
                } else {
                    alert("儲存失敗！");
                }
            } catch (err) {
                alert("連線錯誤！");
            }
            toggleLoading(false);
        }
    </script>
</body>
</html>
