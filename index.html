<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水餃訂購系統 - 線上訂購與查詢</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            background-color: #f4f7f6;
        }
        #loadingOverlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255, 255, 255, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
        }
        .sidebar {
            width: 250px;
            background-color: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            padding-top: 20px;
            flex-shrink: 0;
        }
        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 20px;
        }
        .nav-links {
            display: flex;
            flex-direction: column;
            width: 100%;
        }
        .sidebar a {
            color: white;
            text-decoration: none;
            padding: 15px 20px;
            display: block;
            border-left: 4px solid transparent;
            transition: all 0.3s;
            cursor: pointer;
        }
        .sidebar a:hover, .sidebar a.active {
            background-color: #34495e;
            border-left: 4px solid #3498db;
        }
        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 800px;
            margin: 0 auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            vertical-align: middle;
        }
        th {
            background-color: #f8f9fa;
        }
        input[type="number"] {
            width: 70px;
            padding: 6px;
            font-size: 16px;
        }
        .total-row {
            font-weight: bold;
            font-size: 1.2em;
            text-align: right;
            color: #e74c3c;
        }
        .customer-info {
            background: #fdfbf7;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e0dcd3;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input[type="text"], 
        .form-group input[type="tel"],
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 15px;
        }
        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .radio-group label {
            font-weight: normal;
            cursor: pointer;
        }
        .btn-submit {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
            font-weight: bold;
        }
        .btn-submit:hover {
            background-color: #2980b9;
        }
        .btn-query {
            background-color: #2ecc71;
        }
        .btn-query:hover {
            background-color: #27ae60;
        }
        .query-result-card {
            background: #fdfbf7;
            border: 1px solid #e0dcd3;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
            }
            .sidebar {
                width: 100%;
                height: auto;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                padding: 10px 15px;
                box-sizing: border-box;
            }
            .sidebar h2 {
                margin: 0;
                font-size: 16px;
            }
            .nav-links {
                flex-direction: row;
                width: auto;
            }
            .sidebar a {
                padding: 8px 12px;
                font-size: 14px;
                border-left: none;
                border-bottom: 3px solid transparent;
            }
            .sidebar a.active {
                border-bottom: 3px solid #3498db;
            }
            .main-content {
                padding: 15px;
            }
            .card {
                padding: 15px;
            }
            th, td {
                padding: 8px 6px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <div id="loadingOverlay">
        <div style="font-size: 35px; margin-bottom: 15px;">🥟</div>
        <div id="loadingText">處理中，請稍候...</div>
    </div>

    <div class="sidebar">
        <h2>水餃訂購系統</h2>
        <div class="nav-links">
            <a id="navOrder" class="active" onclick="switchView('order')">線上訂購</a>
            <a id="navQuery" onclick="switchView('query')">查詢訂單</a>
        </div>
    </div>

    <div class="main-content">
        
        <!-- 訂購表單 -->
        <div class="card" id="orderSection">
            <h2>🛒 訂購表單</h2>
            <form id="orderForm">
                <table>
                    <thead>
                        <tr>
                            <th>品項名稱</th>
                            <th>單價</th>
                            <th>數量</th>
                            <th>小計</th>
                        </tr>
                    </thead>
                    <tbody id="menuBody"></tbody>
                    <tfoot>
                        <tr>
                            <td colspan="3" style="text-align: right; font-weight: bold;">商品小計 :</td>
                            <td style="font-weight: bold;" id="itemsSubtotal">$0</td>
                        </tr>
                        <tr>
                            <td colspan="3" style="text-align: right; font-weight: bold;">運費 :</td>
                            <td style="font-weight: bold; color: #e74c3c;" id="shippingFeeDisplay">$225</td>
                        </tr>
                        <tr>
                            <td colspan="3" class="total-row">總計 (含運) (TWD) :</td>
                            <td class="total-row" id="grandTotal">225</td>
                        </tr>
                    </tfoot>
                </table>

                <!-- 取貨與配送方式 (具備欄位聯動) -->
                <div class="customer-info">
                    <h3>🚚 取貨與配送方式</h3>
                    <div class="form-group radio-group">
                        <label>
                            <input type="radio" name="fulfillment" value="自取" onclick="updateFulfillment()"> 門市自取 (免運費)
                        </label>
                        <label>
                            <input type="radio" name="fulfillment" value="宅配" checked onclick="updateFulfillment()"> 低溫宅配 ($225)
                        </label>
                        <label>
                            <input type="radio" name="fulfillment" value="團購/公司行號發貨" onclick="updateFulfillment()"> 團購 / 公司行號統一發貨 (如 ELC 等，運費後續確認)
                        </label>
                    </div>
                </div>

                <!-- 訂購人與動態欄位 -->
                <div class="customer-info">
                    <h3>📝 訂購人資訊</h3>
                    <div class="form-group">
                        <label for="groupCode">團購代碼 (選填)</label>
                        <input type="text" id="groupCode" placeholder="如有團購代碼請填寫於此，若無可留空">
                    </div>
                    <div class="form-group">
                        <label for="customerName">姓名</label>
                        <input type="text" id="customerName" required placeholder="請輸入姓名">
                    </div>
                    <div class="form-group">
                        <label for="customerPhone">聯絡電話</label>
                        <input type="tel" id="customerPhone" required placeholder="請輸入電話 (例如: 0912345678)">
                    </div>

                    <!-- 欄位聯動區塊：根據取貨方式動態切換 -->
                    <div class="form-group" id="dynamicFieldContainer">
                        <label id="dynamicLabel" for="customerAddress">收件地址</label>
                        <input type="text" id="customerAddress" required placeholder="請輸入完整收件地址">
                        <div id="dynamicHint" style="font-size: 13px; color: #7f8c8d; margin-top: 5px;">
                            💡 宅配運費預設帶入 225 元，後續若尺寸有異動可在後台更新。
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-submit">送出訂單</button>
            </form>
        </div>

        <!-- 查詢訂單 -->
        <div class="card" id="querySection" style="display: none;">
            <h2>🔍 查詢我的訂單</h2>
            <p style="color: #7f8c8d; font-size: 15px; margin-bottom: 20px;">💡 請輸入「訂單編號」或「聯絡電話」 (擇一輸入即可查詢)</p>
            
            <div class="form-group">
                <label for="qOrderNum">訂單編號</label>
                <input type="text" id="qOrderNum" placeholder="例如: 202609041430AB">
            </div>
            <div class="form-group" style="margin-bottom: 25px;">
                <label for="qPhone">聯絡電話</label>
                <input type="tel" id="qPhone" placeholder="例如: 0912345678">
            </div>
            
            <button type="button" class="btn-submit btn-query" onclick="doQuery()">開始查詢</button>
            
            <div id="queryResultList" style="margin-top: 30px;"></div>
        </div>

    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxmGo-q5ar3XtL3jujB9Qb1SAI7KipRctu_xBloQt0jy2lt-Kus4VvceKtLwleYS4am/exec";

        const defaultItems = [
            { name: "高麗菜豬肉水餃 (20顆/盒)", price: 95 },
            { name: "韭菜豬肉水餃 (20顆/盒)", price: 95 },
            { name: "溫州大餛飩 (20顆/盒)", price: 140 },
            { name: "豬肉小餛飩 (15顆/盒)", price: 50 }
        ];

        let currentShippingFee = 225;

        function toggleLoading(show, text="處理中...") {
            const overlay = document.getElementById('loadingOverlay');
            const textEl = document.getElementById('loadingText');
            if (overlay && textEl) {
                textEl.innerText = text;
                overlay.style.display = show ? 'flex' : 'none';
            }
        }

        function switchView(view) {
            const orderSec = document.getElementById('orderSection');
            const querySec = document.getElementById('querySection');
            const navOrder = document.getElementById('navOrder');
            const navQuery = document.getElementById('navQuery');

            if (view === 'order') {
                orderSec.style.display = 'block';
                querySec.style.display = 'none';
                navOrder.classList.add('active');
                navQuery.classList.remove('active');
            } else if (view === 'query') {
                orderSec.style.display = 'none';
                querySec.style.display = 'block';
                navOrder.classList.remove('active');
                navQuery.classList.add('active');
            }
        }

        function renderMenu(items) {
            const menuBody = document.getElementById('menuBody');
            if (!menuBody) return;
            menuBody.innerHTML = '';
            
            items.forEach((item) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.name}</td>
                    <td>$${item.price}</td>
                    <td><input type="number" min="0" value="0" class="qty-input" data-price="${item.price}" data-name="${item.name}"></td>
                    <td class="subtotal">$0</td>
                `;
                menuBody.appendChild(tr);
            });

            document.querySelectorAll('.qty-input').forEach(input => {
                input.addEventListener('input', function() {
                    let qty = parseInt(this.value);
                    if (isNaN(qty) || qty < 0) {
                        this.value = 0;
                        qty = 0;
                    }
                    const price = parseInt(this.getAttribute('data-price')) || 0;
                    const subtotal = price * qty;
                    this.parentElement.nextElementSibling.innerText = `$${subtotal}`;
                    updateGrandTotal();
                });
            });
        }

        // 欄位聯動邏輯：根據配送方式切換介面
        function updateFulfillment() {
            const fulfillmentType = document.querySelector('input[name="fulfillment"]:checked').value;
            const dynamicLabel = document.getElementById('dynamicLabel');
            const customerAddress = document.getElementById('customerAddress');
            const dynamicHint = document.getElementById('dynamicHint');
            
            if (fulfillmentType === '自取') {
                currentShippingFee = 0;
                dynamicLabel.innerText = "取貨門市 / 時段說明";
                customerAddress.value = "門市自取";
                customerAddress.readOnly = true; // 鎖定不需手動填寫地址
                dynamicHint.innerHTML = "💡 選擇門市自取免運費。將於約定時間由您親自至門市取貨。";
            } else if (fulfillmentType === '宅配') {
                currentShippingFee = 225;
                dynamicLabel.innerText = "收件地址";
                customerAddress.value = "";
                customerAddress.readOnly = false;
                customerAddress.placeholder = "請輸入完整收件地址";
                dynamicHint.innerHTML = "💡 低溫宅配運費預設 225 元，後續若尺寸有異動可在後台更新。";
            } else if (fulfillmentType === '團購/公司行號發貨') {
                currentShippingFee = 0;
                dynamicLabel.innerText = "公司名稱 / 部門 / 收件備註";
                customerAddress.value = "";
                customerAddress.readOnly = false;
                customerAddress.placeholder = "例如: 長榮物流 ELC 辦公室";
                dynamicHint.innerHTML = "💡 選擇公司統一發貨，運費將依實際配送狀況（如 Uber 等）計算，由管理者於後台確認並更新。";
            }
            document.getElementById('shippingFeeDisplay').innerText = fulfillmentType === '團購/公司行號發貨' ? `$0 (後續確認)` : `$${currentShippingFee}`;
            updateGrandTotal();
        }

        function updateGrandTotal() {
            let itemsSubtotal = 0;
            document.querySelectorAll('.qty-input').forEach(input => {
                const price = parseInt(input.getAttribute('data-price')) || 0;
                const qty = parseInt(input.value) || 0;
                itemsSubtotal += (price * qty);
            });
            
            const fulfillmentType = document.querySelector('input[name="fulfillment"]:checked').value;
            let grandTotal = itemsSubtotal + (fulfillmentType === '團購/公司行號發貨' ? 0 : currentShippingFee);
            
            document.getElementById('itemsSubtotal').innerText = `$${itemsSubtotal}`;
            document.getElementById('grandTotal').innerText = grandTotal;
        }

        function generateOrderNumber() {
            const now = new Date();
            const pad = (n) => n.toString().padStart(2, '0');
            const YYYY = now.getFullYear();
            const MM = pad(now.getMonth() + 1);
            const DD = pad(now.getDate());
            const HH = pad(now.getHours());
            const MIN = pad(now.getMinutes());
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let randomCode = chars.charAt(Math.floor(Math.random() * chars.length)) + chars.charAt(Math.floor(Math.random() * chars.length));
            return `${YYYY}${MM}${DD}${HH}${MIN}${randomCode}`;
        }

        renderMenu(defaultItems);

        async function syncMenuFromCloud() {
            try {
                let res = await fetch(API_URL + "?action=getMenu");
                let json = await res.json();
                if (json && json.success && json.data && json.data.length > 0) {
                    renderMenu(json.data);
                }
            } catch (err) {
                console.log("背景同步略過");
            }
        }
        syncMenuFromCloud();

        // 送出訂單
        document.getElementById('orderForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            let itemsSubtotal = 0;
            document.querySelectorAll('.qty-input').forEach(input => {
                const price = parseInt(input.getAttribute('data-price')) || 0;
                const qty = parseInt(input.value) || 0;
                itemsSubtotal += (price * qty);
            });

            if (itemsSubtotal === 0) {
                alert("您尚未選擇任何商品！");
                return;
            }

            const fulfillmentType = document.querySelector('input[name="fulfillment"]:checked').value;
            let itemsTextArr = [];
            
            let fulfillmentDesc = '';
            let recordedShipping = currentShippingFee;
            if (fulfillmentType === '自取') {
                fulfillmentDesc = '門市自取 (免運費)';
                recordedShipping = 0;
            } else if (fulfillmentType === '宅配') {
                fulfillmentDesc = `低溫宅配 ($${currentShippingFee})`;
                recordedShipping = currentShippingFee;
            } else {
                fulfillmentDesc = '團購 / 公司行號統一發貨 (運費待後台確認)';
                recordedShipping = 0;
            }

            itemsTextArr.push(`【配送方式】${fulfillmentDesc}`);
            itemsTextArr.push(`------------------`);
            
            document.querySelectorAll('.qty-input').forEach(input => {
                const qty = parseInt(input.value) || 0;
                if (qty > 0) {
                    itemsTextArr.push(`${input.getAttribute('data-name')} x ${qty}`);
                }
            });
            
            itemsTextArr.push(`------------------`);
            itemsTextArr.push(`商品小計：$${itemsSubtotal}`);
            itemsTextArr.push(`運費：${fulfillmentType === '團購/公司行號發貨' ? '待管理者確認' : '$' + recordedShipping}`);

            const orderNum = generateOrderNumber();
            const orderDate = new Date().toLocaleString();
            const name = document.getElementById('customerName').value.trim();
            const phone = document.getElementById('customerPhone').value.trim();
            const address = document.getElementById('customerAddress').value.trim();
            const groupCode = document.getElementById('groupCode').value.trim();
            const itemsText = itemsTextArr.join(' \n ');
            const totalAmount = itemsSubtotal + recordedShipping;

            const params = new URLSearchParams({
                action: "addOrder",
                orderNumber: orderNum,
                orderDate: orderDate,
                name: name,
                phone: phone,
                address: address,
                groupCode: groupCode,
                itemsText: itemsText,
                total: totalAmount
            });

            toggleLoading(true, "訂單傳送中，請稍候...");

            try {
                let res = await fetch(API_URL + "?" + params.toString());
                let rawText = await res.text();
                
                let json;
                try {
                    json = JSON.parse(rawText);
                } catch (parseErr) {
                    alert("伺服器回應格式錯誤！請確認 Apps Script 權限。");
                    toggleLoading(false);
                    return;
                }
                
                if (json && json.success) {
                    let successMsg = `訂單送出成功！\n您的訂單編號為：${orderNum}\n商品小計：$${itemsSubtotal}\n運費：${fulfillmentType === '團購/公司行號發貨' ? '待管理者確認' : '$' + recordedShipping}\n總金額：$${totalAmount}`;
                    if (groupCode) successMsg += `\n團購代碼：${groupCode}`;
                    alert(successMsg);
                    
                    document.getElementById('orderForm').reset();
                    document.querySelector('input[name="fulfillment"][value="宅配"]').checked = true;
                    updateFulfillment();
                } else {
                    alert("系統發生錯誤：" + (json.error || "未知錯誤"));
                }
            } catch (err) {
                alert("網路連線錯誤，請重試！");
            }

            toggleLoading(false);
        });

        // 查詢訂單 (加強取貨細節與核對呈現)
        async function doQuery() {
            const num = document.getElementById('qOrderNum').value.trim();
            const phoneInput = document.getElementById('qPhone').value.trim();
            const resDiv = document.getElementById('queryResultList');

            if (!num && !phoneInput) {
                alert("請至少輸入「訂單編號」或「聯絡電話」其中一項！");
                return;
            }

            toggleLoading(true, "正在向資料庫查詢...");

            try {
                let res = await fetch(API_URL + "?action=getOrders");
                let json = await res.json();
                
                if (json && json.success) {
                    let cleanInputPhone = phoneInput.replace(/^0+/, '');

                    let matchedOrders = json.data.filter(o => {
                        let matchNum = num ? (String(o.orderNumber).trim() === num) : true;
                        let cleanDbPhone = String(o.phone).replace(/^0+/, '').trim();
                        let matchPhone = phoneInput ? (cleanDbPhone === cleanInputPhone) : true;
                        return matchNum && matchPhone;
                    });
                    
                    if (matchedOrders.length > 0) {
                        matchedOrders.reverse();
                        let html = `<h3>✅ 查詢到 ${matchedOrders.length} 筆訂單：</h3>`;
                        
                        matchedOrders.forEach(targetOrder => {
                            let statusColor = targetOrder.status === '已出貨' ? '#2ecc71' : '#e67e22';
                            let groupCodeHtml = targetOrder.groupCode ? `<br><b>團購代碼：</b>${targetOrder.groupCode}` : '';

                            html += `
                                <div class="query-result-card">
                                    <div style="font-size:18px; margin-bottom:8px;">
                                        <b>訂單編號：</b>${targetOrder.orderNumber}
                                    </div>
                                    <div style="color:#7f8c8d; font-size:14px; margin-bottom:10px;">
                                        <b>訂購時間：</b>${targetOrder.orderDate}
                                    </div>
                                    <hr style="border:0; border-top:1px dashed #ccc; margin:10px 0;">
                                    <div style="font-size:14px; line-height:1.6; margin-bottom:10px;">
                                        <b>訂購人：</b>${targetOrder.name}<br>
                                        <b>聯絡電話：</b>${targetOrder.phone}<br>
                                        <b>取貨/配送資訊：</b>${targetOrder.address}
                                        ${groupCodeHtml}
                                    </div>
                                    <hr style="border:0; border-top:1px dashed #ccc; margin:10px 0;">
                                    <b>訂單內容與明細：</b><br>
                                    <div style="background: #fff; padding: 10px; border-radius: 4px; border: 1px solid #eee; margin-top: 5px;">
                                        ${targetOrder.itemsText.replace(/\n/g, '<br>')}
                                    </div>
                                    <hr style="border:0; border-top:1px dashed #ccc; margin:10px 0;">
                                    <div style="display:flex; justify-content:space-between; align-items:center;">
                                        <div style="font-size:16px;"><b>總金額：</b>$${targetOrder.total}</div>
                                        <div style="font-size:16px;">
                                            <b>狀態：</b><span style="color:${statusColor}; font-weight:bold;">${targetOrder.status}</span>
                                        </div>
                                    </div>
                                </div>
                            `;
                        });
                        resDiv.innerHTML = html;
                    } else {
                        resDiv.innerHTML = `<h3 style="color:#e74c3c;">❌ 查無相關訂單，請確認輸入資訊是否正確。</h3>`;
                    }
                } else {
                    resDiv.innerHTML = `<h3 style="color:#e74c3c;">❌ 查詢失敗，無法取得資料庫資料。</h3>`;
                }
            } catch (err) {
                resDiv.innerHTML = `<h3 style="color:#e74c3c;">查詢網路連線錯誤，請稍後再試。</h3>`;
            }

            toggleLoading(false);
        }
    </script>
